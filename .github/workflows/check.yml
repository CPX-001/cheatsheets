name: Check site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm lint:check
      - run: pnpm build
      - run: pnpm test:build
